<style>
:root{--bg:#0b0a17;--bg2:#100e20;--panel:#15132a;--panel2:#1b1935;--line:#28244a;--ink:#efeafc;--dim:#8f89b0;--acc:#b9a6ff;--acc2:#7ef0c9;--gold:#f3c85a;--red:#ff7a8a;--pad:clamp(14px,3vw,36px);--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;background:var(--bg)}

a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}

.dim{color:var(--dim)} .up{color:var(--acc2)} .down{color:var(--red)} .num{font-variant-numeric:tabular-nums}

.brand img{width:30px;height:30px;border-radius:9px}
.nav{display:flex;gap:4px;margin-left:10px}
.nav a{padding:7px 12px;border-radius:999px;color:var(--dim);transition:.15s}
.nav a:hover{color:var(--ink)} .nav a.on{background:var(--panel2);color:var(--ink)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:500;white-space:nowrap;transition:transform .12s,border-color .15s,background .15s}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#140f2e} .btn.pri:hover{background:#cbbcff}

.btn.icon{width:38px;padding:0}

.in{width:min(1180px,100%);margin:0 auto}

.hero{position:relative;margin:0 calc(var(--pad)*-1);padding:clamp(40px,7vw,90px) var(--pad) clamp(30px,5vw,60px);overflow:hidden;border-bottom:1px solid var(--line)}

.scroll{overflow-x:auto}
label.f{display:flex;flex-direction:column;gap:6px;margin-top:14px}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}

.create{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.upload{display:grid;place-items:center;aspect-ratio:1;width:140px;border-radius:18px;border:1px dashed var(--line);background:var(--bg2);cursor:pointer;overflow:hidden;color:var(--dim);text-align:center;font-size:12px}
.upload img{width:100%;height:100%;object-fit:cover}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.pick{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);text-align:left}
.pick.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(185,166,255,.15)} .pick small{display:block;color:var(--dim)}
.flow{display:grid;gap:8px;margin-top:14px}
.flow div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.flow div i{font-style:normal;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--panel2);font-size:11px;color:var(--acc)}
.flow div span{margin-left:auto;color:var(--dim);font-size:12px;text-align:right}
.sticky{position:sticky;top:78px}
.thead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:24px}
.thead .tico{width:72px;height:72px;border-radius:20px} .thead h1{font-size:clamp(30px,4.4vw,48px)}
.tstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:18px}
.tstats div{background:var(--panel);padding:14px 16px} .tstats b{display:block;margin-top:3px;font-family:"Syne",sans-serif;font-weight:700;font-size:clamp(16px,1.9vw,21px)}
.lay{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
.lay>*,.create>*{min-width:0}
.col{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)} .col>*{min-width:0}
.chart{height:280px;position:relative} .chart svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.tabs button{height:34px;border-radius:999px;color:var(--dim)} .tabs button.on{background:var(--acc);color:#140f2e} .tabs button.on.sell{background:var(--red)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.presets button{padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:12px} .presets button:hover{border-color:var(--acc)}
.quote{margin-top:12px;display:grid;gap:6px;font-size:12.5px} .quote div{display:flex;justify-content:space-between;gap:10px}
.svc{display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:var(--acc2);box-shadow:0 0 0 0 rgba(126,240,201,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(126,240,201,0)}100%{box-shadow:0 0 0 0 rgba(126,240,201,0)}}
.bar{height:8px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.pipe div{padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);text-align:center;font-size:11.5px;color:var(--dim)}
.pipe div.done{color:var(--acc2);border-color:rgba(126,240,201,.35)} .pipe div.on{color:var(--ink);border-color:var(--acc);animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 16px rgba(185,166,255,.35)}}
.list{display:grid;gap:2px;margin-top:10px}
.list>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 10px;border-radius:10px}
.list>div:nth-child(odd){background:var(--bg2)} .list>div.me{outline:1px solid var(--acc)}
.rtbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.rtbl th{text-align:left;font-weight:400;color:var(--dim);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
.rtbl td{padding:10px;border-bottom:1px solid var(--line)}
.empty{padding:22px;text-align:center;color:var(--dim)}
.note{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:#cfc8ea;font-size:12.5px}
.note.warn{border-color:rgba(243,200,90,.5)}
.progress{display:grid;gap:8px;margin-top:14px}
.progress div{display:flex;align-items:center;gap:10px;color:var(--dim)} .progress div.on{color:var(--ink)} .progress div.done{color:var(--acc2)}
.progress i{width:10px;height:10px;border-radius:50%;border:1px solid currentColor;flex:none} .progress div.done i{background:currentColor} .progress div.on i{background:var(--acc);border-color:var(--acc);animation:glow 1s infinite}
.modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:var(--pad);background:rgba(5,4,12,.72)}
.modal.on{display:grid}
.modal .panel{width:min(420px,100%)}
.wbtn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);margin-top:8px;text-align:left}
.wbtn:hover{border-color:var(--acc)} .wbtn img{width:28px;height:28px;border-radius:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);opacity:0;z-index:80;background:var(--panel2);border:1px solid var(--acc);border-radius:14px;padding:11px 16px;transition:.2s;pointer-events:none;max-width:calc(100% - 28px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto} .toast.bad{border-color:var(--red)}
footer{padding:26px var(--pad);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:12px}
footer a:hover{color:var(--ink)}
@media (max-width:980px){
  .nets,.route,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:minmax(0,1fr)}
  .lay,.create{grid-template-columns:minmax(0,1fr)}
  .tstats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sticky{position:static}
}
@media (max-width:640px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(11,10,23,.97);gap:8px}
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(11,10,23,.94);border-top:1px solid var(--line);backdrop-filter:blur(12px)}
  main{padding-bottom:90px}
  .brand span,.top .hidem{display:none}
  .hero .bg{left:0;background-position:70% 50%;opacity:.45}
  .net span{display:none}
  .steps button span{display:none}
  .picks{grid-template-columns:minmax(0,1fr)}
  footer{padding-bottom:90px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

<div class="modal" id="wm"><div class="panel pp"><div class="between"><h3>Connect a wallet</h3><button class="btn icon" id="wmX" aria-label="Close">✕</button></div><p class="dim" style="margin-top:6px;font-size:12.5px">Robinhood Chain is added to your wallet if it is missing</p><div id="wlist"></div></div></div>

<script type="module">
import * as W from '/lib/wallet.js';
import * as P from '/lib/pons.js';
import { formatEther, formatUnits, parseEther, maxUint256 } from 'https://cdn.jsdelivr.net/npm/viem@2.21.55/+esm';

const S = window.SITE, CA = (S.CA || 'SOON').trim(), HAS = CA !== 'SOON' && CA !== '';
const $ = id => document.getElementById(id), app = $('app');
document.querySelectorAll('[data-link="pons"]').forEach(a => { a.href = HAS ? PONS_HOME + '/' + CA : PONS_HOME; a.target = '_blank'; a.rel = 'noopener'; });
document.querySelectorAll('[data-link="dex"]').forEach(a => { a.href = HAS ? DEX_HOME + '/' + CA : DEX_HOME; a.target = '_blank'; a.rel = 'noopener'; });
document.querySelectorAll('[data-link="x"]').forEach(a => { a.href = S.X_URL || 'https://x.com'; a.target = '_blank'; a.rel = 'noopener'; });

const NETS = {
  bnb: { name: 'BNB Chain', color: '#f3ba2f', assets: { BNB: 18, USDT: 18 }, scan: 'https://bscscan.com' },
  base: { name: 'Base', color: '#2f6bff', assets: { ETH: 18, USDC: 6 }, scan: 'https://basescan.org' },
  ethereum: { name: 'Ethereum', color: '#8c93ff', assets: { ETH: 18, USDC: 6 }, scan: 'https://etherscan.io' },
  hyperliquid: { name: 'Hyperliquid', color: '#58e1c1', assets: { HYPE: 18, USDC: 6 }, scan: 'https://hyperevmscan.io' }
};
const CG = { ETH: 'ethereum', BNB: 'binancecoin', HYPE: 'hyperliquid', USDC: 'usd-coin', USDT: 'tether' };
const ST = { tokens: [], token: null, rewards: [], operator: null, roundMin: parseEther('0.01'), cooldown: 600, px: {}, launch: null, w: W.state() };
const BIG = new Set(['price', 'quoteReserve', 'tokenReserve', 'realQuote', 'threshold', 'pendingFees', 'feeBal', 'taxBal', 'sellable', 'feeBps', 'creatorTaxBps', 'vault', 'paid', 'swept', 'roundMin', 'eth', 'tokens', 'amount', 'mine', 'launchFee', 'gasBuffer', 'amountIn', 'total']);
const big = o => JSON.parse(JSON.stringify(o), (k, v) => BIG.has(k) && typeof v === 'string' && /^-?\d+$/.test(v) ? BigInt(v) : v);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowS = () => Math.floor(Date.now() / 1000);

/* format */
const f = (x, d = 4) => Number(x).toLocaleString('en-US', { maximumFractionDigits: d });
const eth = (w, d = 4) => { const n = Number(formatEther(BigInt(w || 0))); return n < 1e-9 ? '0' : n < 0.0001 ? n.toExponential(2) : f(n, d); };
const tokAmt = w => { const n = Number(formatEther(BigInt(w || 0))); return n >= 1e9 ? f(n / 1e9, 2) + 'B' : n >= 1e6 ? f(n / 1e6, 2) + 'M' : n >= 1e3 ? f(n / 1e3, 1) + 'K' : f(n, 2); };

  $('disc').onclick = () => { W.disconnect(); location.hash = '#/'; };
  const R = ST.rewards;
  $('pfR').innerHTML = R.length ? R.map(r => `<div><span><a class="lnk" href="#/t/${r.token}">$${esc(r.symbol)}</a> · round #${r.n}<div class="dim" style="font-size:11.5px">${NETS[r.net].name} · ${ago(r.t)}${r.destTx ? ' · <a class="lnk" href="' + NETS[r.net].scan + '/tx/' + r.destTx + '" target="_blank" rel="noopener">payout ↗</a>' : ''}</div></span><span class="num">${units(r.amount, r.asset, r.net)}<div class="dim" style="font-size:11.5px;text-align:right">${usd(assetUsd(r.amount, r.asset, r.net))}</div></span></div>`).join('') : '<div class="empty">Hold a Noughtpad token and your share of every round lands here</div>';
  const seq = ++holdSeq, user = ST.w.address;
  Promise.all(ST.tokens.slice(0, 60).map(t => W.pub.readContract({ address: t.token, abi: P.TOKEN_ABI, functionName: 'balanceOf', args: [user] }).then(b => ({ t, b })).catch(() => ({ t, b: 0n })))).then(rows => {
    if (seq !== holdSeq || !$('pfH')) return;
    const held = rows.filter(x => x.b > 0n);
    $('pfH').innerHTML = held.length ? held.map(({ t, b }) => `<div><span class="row" style="flex-wrap:nowrap">${ico(t, 'tico" style="width:34px;height:34px;border-radius:10px')}<a href="#/t/${t.token}">${esc(t.name)} <span class="dim">$${esc(t.symbol)}</span></a></span><span class="num">${tokAmt(b)}</span></div>`).join('') : '<div class="empty">No Noughtpad tokens yet · <a href="#/discover" class="up">browse</a></div>';
  });
}

/* boot */
paintWallet(); prices(); render();
W.restore().then(s => { ST.w = s; paintWallet(); });
setInterval(prices, 60000);
setInterval(() => { if (!document.hidden) load(); }, 8000);
setInterval(() => { if (!document.hidden && route === 'token') fetch('/api/tick').catch(() => {}); }, 65000);
</script>
</body>
</html>
