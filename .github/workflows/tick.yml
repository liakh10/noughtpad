name: reward service
# The timer was switched off on 2026-09-17: it was polling the public Robinhood RPC around the
# clock for nothing. Run this by hand from the Actions tab when it is actually needed.
on:
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Advance sweeps and reward rounds
        run: |
          curl -sS --max-time 300 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://noughtpad.vercel.app/api/tick
